
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search and explore Pokemon using the PokeAPI.">

    <title>Pokédex | Pokémon Explorer</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>Pokédex</h1>
        <p>Explore the world of Pokémon</p>
    </header>

    <main>
        <section aria-labelledby="search-heading">

            <h2 id="search-heading">Find a Pokémon</h2>

            <form id="search-form">
                <label for="pokemon-search">
                    Enter a Pokémon name or ID:
                </label>

                <input
                    type="text"
                    id="pokemon-search"
                    placeholder="Example: Pikachu"
                    required
                >

                <button type="submit">Search</button>
            </form>

        </section>

        <section id="results" aria-live="polite" aria-label="Pokémon search results">

            <p id="message">
                Search for a Pokémon to see its information!
            </p>

            <article id="pokemon-card" hidden>

                <h2 id="pokemon-name"></h2>

                <img id="pokemon-image" src="" alt="">

                <p id="pokemon-id"></p>

                <p id="pokemon-type"></p>

                <p id="pokemon-height"></p>

                <p id="pokemon-weight"></p>

                <p id="pokemon-abilities"></p>

            </article>

        </section>
    </main>

    <footer>
        <p>Powered by <a href="https://pokeapi.co/" target="_blank" rel="noopener noreferrer">PokéAPI</a></p>
        <p>Pokédex Web Application | 2026</p>
    </footer>

</body>
</html>
